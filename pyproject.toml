[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csg"
version = "0.1.0"
description = "Config Size Guard — detects bloated config files"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.scripts]
csg = "csg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]