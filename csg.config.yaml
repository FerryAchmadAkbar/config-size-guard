max_array_length: 1000

max_key_growth_ratio: 2.0

fallback_entropy: 5.8
fallback_string_length: 400

static_floor:
  size_warn_kb: 500
  size_fail_kb: 10240

growth_warn_pct:   20
growth_fail_pct:   50
growth_warn_bytes: 102400
growth_fail_bytes: 512000

absolute_min_peer_count: 4
absolute_peer_min_bytes: 1024
corpus_min_samples: 20
